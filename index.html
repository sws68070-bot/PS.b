<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receptor de Tela</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 30px 16px;
  }
  h1 { margin-bottom: 6px; }
  .sub { color: #888; margin-bottom: 24px; font-size: 14px; }
  .card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 480px;
    text-align: center;
  }
  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #0f0f0f;
    color: #fff;
    font-size: 16px;
    text-align: center;
    margin: 12px 0;
  }
  button {
    background: #4ade80;
    color: #0f0f0f;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    width: 100%;
  }
  button:disabled { background: #333; color: #888; cursor: not-allowed; }
  button:hover:not(:disabled) { opacity: 0.9; }
  #status {
    margin-top: 16px;
    font-size: 12px;
    color: #aaa;
    text-align: left;
    background: #000;
    padding: 10px;
    border-radius: 8px;
    max-height: 160px;
    overflow-y: auto;
    font-family: monospace;
  }
  video {
    width: 100%;
    max-width: 960px;
    margin-top: 20px;
    border-radius: 12px;
    border: 1px solid #2a2a2a;
    background: #000;
  }
  #btnPlay {
    display: none;
    margin-top: 12px;
  }
</style>
</head>
<body>

  <h1>👁 Receptor de Tela</h1>
  <p class="sub">Digite o código do transmissor pra assistir</p>

  <div class="card">
    <input id="idTransmissor" placeholder="Cole o código do transmissor aqui">
    <button id="btnConectar">Conectar</button>
    <div id="status">Conectando ao servidor...</div>
  </div>

  <video id="tela" autoplay playsinline></video>
  <button id="btnPlay">▶ Clique para exibir o vídeo</button>

  <script>
    const log = (msg) => {
      const el = document.getElementById('status');
      const linha = document.createElement('div');
      linha.textContent = `${new Date().toLocaleTimeString()} — ${msg}`;
      el.prepend(linha);
    };

    const peer = new Peer(); // servidor gratuito público do PeerJS
    const btn = document.getElementById('btnConectar');
    const input = document.getElementById('idTransmissor');
    const video = document.getElementById('tela');
    const btnPlay = document.getElementById('btnPlay');

    peer.on('open', () => {
      log('Conectado ao servidor. Pronto para conectar em um transmissor.');
      btn.disabled = false;
    });

    peer.on('disconnected', () => {
      log('Desconectado do servidor. Tentando reconectar...');
      peer.reconnect();
    });

    peer.on('error', (err) => {
      log(`Erro: ${err.type} — ${err.message || ''}`);
      console.error(err);
    });

    // Recebe a chamada que o transmissor faz de volta, já com o vídeo
    peer.on('call', (call) => {
      log('Transmissor está enviando o vídeo, respondendo chamada...');
      call.answer(); // respondemos sem enviar stream nenhum, só recebendo

      call.on('stream', (streamRemoto) => {
        log('Stream recebido! Exibindo vídeo.');
        video.srcObject = streamRemoto;

        video.play().catch(() => {
          // Autoplay bloqueado pelo navegador — mostra botão manual
          log('Autoplay bloqueado pelo navegador. Clique no botão para iniciar.');
          btnPlay.style.display = 'block';
        });
      });

      call.on('close', () => {
        log('Transmissão encerrada.');
        video.srcObject = null;
      });

      call.on('error', (err) => {
        log(`Erro na chamada: ${err}`);
      });
    });

    btnPlay.addEventListener('click', () => {
      video.play();
      btnPlay.style.display = 'none';
    });

    btn.addEventListener('click', () => {
      const idAlvo = input.value.trim();
      if (!idAlvo) return;

      log(`Solicitando conexão com ${idAlvo}...`);

      // Abre uma conexão de dados só pra avisar o transmissor que queremos assistir
      const dataConn = peer.connect(idAlvo);

      dataConn.on('open', () => {
        log('Pedido enviado. Aguardando o transmissor iniciar o vídeo...');
      });

      dataConn.on('data', (msg) => {
        log(`Mensagem do transmissor: ${msg}`);
      });

      dataConn.on('error', (err) => {
        log(`Falha ao conectar: ${err}`);
      });
    });
  </script>
</body>
</html>
