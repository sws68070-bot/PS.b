<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreamento de Mão em Tempo Real</title>

  <!-- Bibliotecas do MediaPipe para Hands e Camera -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 20px;
    }

    .container {
      position: relative;
      width: 640px;
      height: 480px;
    }

    /* Inverte o vídeo e a tela para funcionar como um espelho */
    #webcam, #output_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      transform: scaleX(-1);
    }
  </style>
</head>
<body>

  <h1>Rastreamento de Mão ✋</h1>

  <div class="container">
    <!-- Elemento para capturar a webcam (escondido atrás do canvas) -->
    <video id="webcam" autoplay playsinline></video>
    <!-- Canvas onde os pontos da mão serão desenhados -->
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    // Função executada a cada frame capturado com o resultado do rastreamento
    function onResults(results) {
      // Limpa o canvas
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      // Desenha a imagem da câmera no canvas
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // Se encontrar alguma mão...
      if (results.multiHandLandmarks) {
        for (const landmarks of results.multiHandLandmarks) {
          // Desenha as linhas conectando os pontos
          drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 5});
          // Desenha os pontos articulares da mão
          drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 2, radius: 5});
        }
      }
      canvasCtx.restore();
    }

    // Configuração do modelo MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,           // Detecta até 2 mãos
      modelComplexity: 1,       // Precisão do modelo (0 para mais leve, 1 para balanceado)
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    // Inicialização da Câmera
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({image: videoElement});
      },
      width: 640,
      height: 480
    });

    camera.start();
  </script>
</body>
</html>
